# Isolate backend unit/integration tests from the live development database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${TEST_DB_NAME:vanni_test}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${TEST_DB_USER:root}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_ROOT_PASSWORD:rootpass}}
storage.local.dir=${java.io.tmpdir}/vanni-test-uploads
