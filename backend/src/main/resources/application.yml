server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: vanni
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:vanni}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:vanni}
    password: ${DB_PASSWORD:vannipass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:10}MB
      max-request-size: ${MAX_UPLOAD_MB:10}MB

jwt:
  secret: ${JWT_SECRET:change-me-to-a-64-char-random-string-that-is-at-least-256-bits-long-vanni}
  access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}

cookie:
  secure: ${COOKIE_SECURE:false}

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  link-previews:
    allow-localhost-for-tests: false
  schedule:
    min-lead-seconds: ${SCHEDULE_MIN_LEAD_SECONDS:60}
    max-days: ${SCHEDULE_MAX_DAYS:365}
    max-pending-per-user: ${SCHEDULE_MAX_PENDING_PER_USER:50}
  ai:
    features-enabled: ${AI_FEATURES_ENABLED:false}
    provider: ${AI_PROVIDER:anthropic}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-haiku-4-5}
    max-input-chars: ${AI_MAX_INPUT_CHARS:60000}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    rate-per-hour: ${AI_RATE_PER_HOUR:10}
    rate-per-day: ${AI_RATE_PER_DAY:30}

storage:
  provider: ${STORAGE_PROVIDER:local}
  local:
    dir: ${STORAGE_LOCAL_DIR:./uploads}
