server:
  forward-headers-strategy: native

cookie:
  secure: ${COOKIE_SECURE:true}

app:
  allowed-origins: ${ALLOWED_ORIGINS:https://vanni.example.com}
  security:
    hsts-enabled: true

spring:
  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.vanni: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
